<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="sweep">
  <style>@media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }</style>
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <!-- viewfinder corner brackets -->
  <g fill="none" stroke="#b89dff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 5.5H5.5V12.5"/>
    <path d="M19.5 5.5H26.5V12.5"/>
    <path d="M12.5 26.5H5.5V19.5"/>
    <path d="M19.5 26.5H26.5V19.5"/>
  </g>
  <!-- miniature QR: three finder squares + data dots -->
  <g fill="#b89dff">
    <rect x="11" y="11" width="4.4" height="4.4" rx="1"/>
    <rect x="16.6" y="11" width="4.4" height="4.4" rx="1"/>
    <rect x="11" y="16.6" width="4.4" height="4.4" rx="1"/>
    <circle cx="19.2" cy="19.2" r="1.4"/>
    <circle cx="17.2" cy="19.2" r="1.4"/>
  </g>
  <!-- lock-on pulse at code centre -->
  <circle cx="16" cy="16" r="1.6" fill="none" stroke="#b89dff" stroke-width="2">
    <animate attributeName="r" values="1.6;2.6;1.6" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- sweeping scan beam -->
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#b89dff" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <animate attributeName="y1" values="7.5;25.5;25.5;7.5" keyTimes="0;0.45;0.55;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="7.5;25.5;25.5;7.5" keyTimes="0;0.45;0.55;1" dur="3.6s" repeatCount="indefinite"/>
  </line>
</svg>
