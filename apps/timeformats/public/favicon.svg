<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="timeformats">
  <style>@media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }</style>
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <!-- clock face -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#b89dff" stroke-width="2.5"/>
  <!-- minute hand: one full turn per 60s -->
  <line x1="16" y1="16" x2="16" y2="8.5" stroke="#b89dff" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="60s" repeatCount="indefinite"/>
  </line>
  <!-- hour hand: 1/12 of the minute speed -->
  <line x1="16" y1="16" x2="16" y2="11.5" stroke="#b89dff" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;30 16 16" dur="60s" repeatCount="indefinite"/>
  </line>
</svg>
