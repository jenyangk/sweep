<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>404 — not found | timezones</title>
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{height:100%}
      body{
        min-height:100%;display:grid;place-items:center;
        background:#0a0a0b;color:#e8e8ec;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        -webkit-font-smoothing:antialiased;
      }
      main{text-align:center;padding:2rem}
      .brand{
        display:inline-flex;align-items:center;gap:.4rem;
        text-decoration:none;color:#b89dff;font-size:1.1rem;
        margin-bottom:2rem;
      }
      .brand .mu{font-size:1.3rem;line-height:1}
      h1{font-size:5rem;font-weight:700;color:#b89dff;line-height:1;margin-bottom:.5rem}
      p{color:#8a8a92;font-size:.95rem;margin-bottom:.5rem}
      a.back{color:#b89dff;text-decoration:none;font-size:.9rem}
      a.back:hover{text-decoration:underline}
    </style>
  </head>
  <body>
    <main>
      <a href="https://muniee.com" class="brand"><span class="mu" aria-hidden="true">μ</span> muniee</a>
      <h1>404</h1>
      <p>this page doesn't exist.</p>
      <p><a class="back" href="/">← back to timezones</a></p>
    </main>
  </body>
</html>
