<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Theme bootstrap — runs before paint to prevent FOUC -->
    <script data-timezones-theme-bootstrap>
      (() => {
        let theme;
        try {
          const stored = localStorage.getItem("timezones-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {}
        if (!theme) {
          theme = window.matchMedia?.("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <!-- Satoshi font — self-hosted, preloaded for fast first paint -->
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/global.css" />

    <!-- Primary SEO -->
    <title>timezones — compare times across timezones</title>
    <meta
      name="description"
      content="Compare times across timezones. Add zones from the full IANA list, slide the clock, hover the hour grid to see every zone at once. Click the map to jump to a region. Runs in your browser, no server."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="application-name" content="timezones" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="timezones" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="https://timezones.muniee.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="sitemap" href="/sitemap.xml" />

      property="og:description"

    <meta property="og:image" content="https://timezones.muniee.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="timezones — compare times across timezones." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="timezones — compare times across timezones" />
    <meta
      name="twitter:description"
      content="Full IANA timezone list, hour grid comparison, interactive map. In your browser, no server."
    />
    <meta name="twitter:image" content="https://timezones.muniee.com/og.png" />
    <meta name="twitter:image:alt" content="timezones — compare times across timezones." />

  <body>

      </main>
    </div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
